<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarnox Stock Intelligence</title>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h1 class="nav-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #c084fc;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Jarnox Intelligence
        </h1>
        <div class="search-container">
            <input type="text" id="searchInput" list="sample-stocks" class="search-input" placeholder="Search a Symbol (e.g., AAPL)">
            <datalist id="sample-stocks">
                <option value="AAPL">Apple Inc.</option>
                <option value="MSFT">Microsoft</option>
                <option value="GOOGL">Alphabet (Google)</option>
                <option value="RELIANCE.NS">Reliance Industries</option>
                <option value="TCS.NS">Tata Consultancy Services</option>
                <option value="INFY.NS">Infosys</option>
            </datalist>
            <button onclick="searchStock()" class="btn">Search</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container">
        
        <!-- Sidebar: Company List -->
        <aside class="sidebar glass-card">
            <h2>Market Leaders</h2>
            <ul id="company-list" class="company-list">
                <li class="loading">Loading companies...</li>
            </ul>
        </aside>

        <!-- Main Dashboard -->
        <section class="dashboard">
            
            <!-- Summary Cards -->
            <div class="summary-grid">
                <div class="glass-card stat-card">
                    <span class="stat-label">52-Week High</span>
                    <span id="stat-high" class="stat-value text-green">--</span>
                </div>
                <div class="glass-card stat-card">
                    <span class="stat-label">52-Week Low</span>
                    <span id="stat-low" class="stat-value text-red">--</span>
                </div>
                <div class="glass-card stat-card">
                    <span class="stat-label">Avg Close</span>
                    <span id="stat-avg" class="stat-value text-blue">--</span>
                </div>
            </div>

            <!-- Search Results Details -->
            <div id="search-details-card" class="glass-card">
                <h3 id="search-details-title" style="margin-bottom: 0.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">Latest Stock Details</h3>
                <div class="details-grid" id="search-details-content">
                    <!-- Dynamic Content Injected Here -->
                </div>
            </div>

            <!-- Compare Stocks Card -->
            <div class="glass-card" id="compare-card">
                <h3 style="margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">Compare 30-Day Performance</h3>
                <div class="compare-inputs">
                    <input type="text" id="compareSym1" class="search-input" placeholder="Symbol 1 (e.g. AAPL)">
                    <span style="font-weight: bold; color: var(--text-muted)">VS</span>
                    <input type="text" id="compareSym2" class="search-input" placeholder="Symbol 2 (e.g. MSFT)">
                    <button onclick="compareStocks()" class="btn">Compare</button>
                </div>
                <div id="compare-results" class="compare-results-grid">
                    <!-- Comparison results injected here -->
                </div>
            </div>

            <!-- Chart Container -->
            <div class="glass-card">
                <h2 id="chart-title" style="margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">Select a stock to view 30-Day Trend</h2>
                <div class="chart-container">
                    <canvas id="stockChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- Custom Logic -->
    <script src="script.js"></script>
</body>
</html>
